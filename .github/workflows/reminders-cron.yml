name: Hourly Reminders Cron

on:
  schedule:
    # Запускается каждый час в 0 минут
    - cron: '0 * * * *'
  workflow_dispatch: # Ручной запуск через UI

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    
    steps:
      - name: Call reminders-send Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -X POST "${SUPABASE_URL}/functions/v1/reminders-send" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
            -d '{}' \
            --fail \
            --silent \
            --show-error
